<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f7f8fa" rx="24"/><text x="600" y="48" fill="#202938" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">Linux 7.2 SLUB：对象分配与回收的层次</text><rect width="420" height="68" x="390" y="85" fill="#e7eefb" stroke="#6d8fc7" stroke-width="2" rx="14"/><text x="600" y="126" fill="#23395d" font-family="sans-serif" font-size="23" font-weight="700" text-anchor="middle">kmem_cache_alloc()</text><path stroke="#697586" stroke-width="3" d="M600 153v37"/><path fill="none" stroke="#697586" stroke-width="3" d="m588 178 12 14 12-14"/><rect width="470" height="80" x="365" y="195" fill="#e7f5ed" stroke="#63a681" stroke-width="2" rx="14"/><text x="600" y="226" fill="#20563a" font-family="sans-serif" font-size="23" font-weight="700" text-anchor="middle">CPU 本地 sheaf</text><text x="600" y="252" fill="#20563a" font-family="sans-serif" font-size="18" text-anchor="middle">优先从已缓存的对象指针取用</text><path fill="none" stroke="#697586" stroke-width="3" d="M600 275v35H280v30m320-30h320v30"/><rect width="400" height="90" x="80" y="340" fill="#fff" stroke="#aab2bd" stroke-width="2" rx="14"/><rect width="400" height="90" x="720" y="340" fill="#fff0dc" stroke="#d7a15a" stroke-width="2" rx="14"/><text x="280" y="375" fill="#202938" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">本地有对象</text><text x="280" y="403" fill="#475467" font-family="sans-serif" font-size="18" text-anchor="middle">直接返回给调用方</text><text x="920" y="375" fill="#714b18" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">本地缓存不足</text><text x="920" y="403" fill="#714b18" font-family="sans-serif" font-size="18" text-anchor="middle">尝试与 barn / slab 协调</text><path stroke="#697586" stroke-width="3" d="M920 430v35"/><path fill="none" stroke="#697586" stroke-width="3" d="m908 453 12 14 12-14"/><rect width="400" height="75" x="720" y="470" fill="#e7eefb" stroke="#6d8fc7" stroke-width="2" rx="14"/><text x="920" y="500" fill="#23395d" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle">共享 sheaf / slab</text><text x="920" y="525" fill="#23395d" font-family="sans-serif" font-size="17" text-anchor="middle">仍不足时才考虑底层页分配</text><path stroke="#697586" stroke-width="3" d="M920 545v25"/><path fill="none" stroke="#697586" stroke-width="3" d="m908 558 12 14 12-14"/><rect width="280" height="48" x="780" y="575" fill="#fff" stroke="#aab2bd" stroke-width="2" rx="12"/><text x="920" y="605" fill="#202938" font-family="sans-serif" font-size="19" text-anchor="middle">Buddy 页面分配</text><text x="600" y="610" fill="#667085" font-family="sans-serif" font-size="16" text-anchor="middle">每个 CPU 两捆 sheaf（main + spare）；节点 barn 上 sheaves_full / sheaves_empty 各上限 10 捆；slab-&gt;inuse 只在 __slab_free() 里减少</text></svg>
# 网站的基本信息
site:
  tab: hyk's blog # 浏览器标签栏上显示的文本
  title: 💠 hyk's blog # 网站的标题
  description: 如梦令 # 网站的描述，用于SEO等
  language: zh # 网站的语言，例如 "en" 是英文
  favicon: /favicon.ico # 网站的图标，用于浏览器标签栏和其他地方显示
  theme: # 更多主题 https://daisyui.com/docs/themes/；此处修改后构建时会自动同步到 daisyUI
    light: winter # 主题的浅色模式
    dark: dracula # 主题的深色模式
    code: github-dark # 代码块的主题 https://expressive-code.com/guides/themes/
  date_format: ddd MMM DD YYYY # 日期格式设置，支持自定义格式
  blog: # 博客相关配置
    pageSize: 8 # 每页显示的文章数量
  menu: # 菜单配置
    - id: home # 菜单项的唯一标识符
      text: Home  # 菜单项显示的文本
      href: / # 菜单项链接的地址
      svg: "material-symbols:home-outline-rounded"
      target: _self
    - id: about
      text: About
      href: /about
      svg: "material-symbols:info-outline-rounded"
      target: _self
    - id: blog
      text: Blogs
      href: /blog
      svg: "material-symbols:book-2-outline-rounded"
      target: _self
      subItems:
        - id: all
          text: All blogs
          href: /blog
          svg: "material-symbols:ink-pen-outline-rounded"
          target: _self
        - id: kernel
          text: Kernel
          href: /blog/category/Kernel
          svg: "material-symbols:memory"
          target: _self
        - id: tags
          text: Tags
          href: /blog/tags
          svg: "material-symbols:label-outline"
          target: _self
        # 子菜单项配置
    - id: friend
      text: Friend
      href: /friend
      svg: "material-symbols:supervisor-account-outline-rounded"
      target: _self

# 用户的个人信息
user:
  name: hyk # 用户名
  site: "https://sai-7i.github.io" # 用户的网站链接
  avatar: /profile.jpg # 用户头像路径
  sidebar: # 侧边栏配置
    social: # 社交链接列表，留空则不显示
      - href: "https://github.com/sai-7i"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
  footer: # 页脚配置
    social: # 页脚社交链接列表，留空则不显示
      - href: "https://github.com/sai-7i"
        ariaLabel: Github
        title: Github
        svg: "ri:github-line"
      - href: "https://sai-7i.github.io/rss.xml"
        ariaLabel: RSS
        title: RSS Feed
        svg: "ri:rss-line"
